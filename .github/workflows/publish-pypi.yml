name: Publish to PyPI

on:
  push:
    tags:
      - 'v*.*.*'  # Trigger on version tags like v0.1.0

jobs:
  publish:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install build twine
    
    - name: Extract version from tag
      id: get_version
      run: echo "VERSION=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT
    
    - name: Verify version matches
      working-directory: client
      run: |
        VERSION=${{ steps.get_version.outputs.VERSION }}
        PYPROJECT_VERSION=$(grep -oP 'version = "\K[^"]+' pyproject.toml)
        
        if [ "$VERSION" != "$PYPROJECT_VERSION" ]; then
          echo "Error: Tag version ($VERSION) doesn't match pyproject.toml version ($PYPROJECT_VERSION)"
          exit 1
        fi
        
        echo "✓ Version verified: $VERSION"
    
    - name: Build package
      working-directory: client
      run: |
        rm -rf dist/ build/ *.egg-info/
        python -m build
    
    - name: Check distribution
      working-directory: client
      run: twine check dist/*
    
    - name: Publish to PyPI
      working-directory: client
      env:
        TWINE_USERNAME: __token__
        TWINE_PASSWORD: ${{ secrets.PYPI_API_TOKEN }}
      run: twine upload dist/*
    
    - name: Create GitHub Release
      uses: softprops/action-gh-release@v1
      with:
        files: |
          client/dist/*.whl
          client/dist/*.tar.gz
        body: |
          ## Installation
          
          ```bash
          pip install telos-tracker==${{ steps.get_version.outputs.VERSION }}
          ```
          
          ## What's Changed
          
          See [CHANGELOG.md](https://github.com/${{ github.repository }}/blob/main/client/CHANGELOG.md) for details.
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

